<!-- ══════════════════════════════════════════════════════════════════
     CHATBASE CHATBOT — WEBSITE EMBED
     Drop this block just before </body> in index.html, at the spot
     where the "Chatbot widget removed completely" comment is.

     This file is 100% safe to put in your public HTML — it contains
     no secret keys. It only loads Chatbase's public embed script,
     which shows the chat bubble in the corner of your site.
     ══════════════════════════════════════════════════════════════════ -->

<script>
(function(){
  if (!window.chatbase || window.chatbase("getState") !== "initialized") {
    window.chatbase = (...args) => {
      if (!window.chatbase.q) { window.chatbase.q = []; }
      window.chatbase.q.push(args);
    };
    window.chatbase = new Proxy(window.chatbase, {
      get(target, prop) {
        if (prop === "q") { return target.q; }
        return (...args) => target(prop, ...args);
      }
    });
  }

  const onLoad = function(){
    const script = document.createElement("script");
    script.src = "https://www.chatbase.co/embed.min.js";
    // Replace with YOUR chatbot ID from Chatbase (Settings → Embed on website)
    script.id = "_i-08eyDX_w9qX7UKq-ED";
    script.setAttribute("domain", "www.chatbase.co");
    document.body.appendChild(script);
  };

  if (document.readyState === "complete") {
    onLoad();
  } else {
    window.addEventListener("load", onLoad);
  }
})();
</script>
